name: Skill package delivery
description: Register a consumer or notify subscribers after a skill package release

inputs:
  command:
    description: register, notify, or update
    required: true
  token:
    description: Atlantis Courier installation token for register and notify
    required: false
  repository:
    description: owner/repository
    required: true
  pull-number:
    description: Merged skills pull request number for notify
    required: false
  package-names:
    description: JSON array of published skill package names for update
    required: false
  package-token:
    description: Consumer GITHUB_TOKEN with package read access for update
    required: false

outputs:
  subscribed:
    description: Whether the consumer declares the notified package
    value: ${{ steps.run.outputs.subscribed }}

runs:
  using: composite
  steps:
    - shell: bash
      id: run
      env:
        SKILL_DELIVERY_COMMAND: ${{ inputs.command }}
        SKILL_DELIVERY_TOKEN: ${{ inputs.token }}
        SKILL_DELIVERY_REPOSITORY: ${{ inputs.repository }}
        SKILL_DELIVERY_PULL_NUMBER: ${{ inputs.pull-number }}
        SKILL_DELIVERY_PACKAGE_NAMES: ${{ inputs.package-names }}
        SKILL_DELIVERY_PACKAGE_TOKEN: ${{ inputs.package-token }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"
