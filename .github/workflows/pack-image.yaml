name: Pack image

on:
  workflow_call:
    inputs:
      registryURL:
        description: Image registry host
        required: true
        type: string
      registryUser:
        description: Registry login user
        required: true
        type: string
      project:
        description: Registry namespace or registry ID
        required: false
        type: string
      imageNamePrefix:
        description: Prefix before the normalized workspace image name
        required: false
        type: string
      include:
        description: Comma-separated Yarn workspace names or globs
        required: false
        type: string
      exclude:
        description: Comma-separated Yarn workspace names or globs
        required: false
        type: string
      tagPolicy:
        description: Revision or timestamp tag policy
        default: hash-timestamp
        required: false
        type: string
      builder:
        description: Pack builder image
        default: ghcr.io/atls/builder-base:24
        required: false
        type: string
      buildpack:
        description: Pack buildpack image
        default: ghcr.io/atls/buildpack-yarn-workspace:24
        required: false
        type: string
    secrets:
      registryKey:
        required: true
        description: Registry login key
      project:
        required: false
        description: Registry namespace or registry ID
      buildEnv:
        required: false
        description: Build-time variables passed only to Pack

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Select image targets
        id: targets
        uses: atls/buildpacks/buildpacks/image-targets@buildpack-root-1.2.1
        with:
          base: ${{ github.event.before }}
          include: ${{ inputs.include }}
          exclude: ${{ inputs.exclude }}

  publish:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          context: git
          images: ${{ inputs.registryURL }}/${{ secrets.project != '' && secrets.project || inputs.project }}/${{ inputs.imageNamePrefix }}${{ matrix.imageName }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=,enable=${{ inputs.tagPolicy == 'revision' }},priority=300
            type=raw,value={{sha}}-{{date 'x'}},enable=${{ inputs.tagPolicy == 'hash-timestamp' }},priority=300
            type=raw,value=${{ github.event.pull_request.number || github.event.issue.number || 'local' }}-{{sha}}-{{date 'x'}},enable=${{ inputs.tagPolicy == 'ctx-hash-timestamp' }},priority=300
            type=raw,value=latest,priority=100

      - name: Login to registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ inputs.registryURL }}
          username: ${{ inputs.registryUser }}
          password: ${{ secrets.registryKey }}

      - name: Setup Pack
        uses: buildpacks/github-actions/setup-pack@v6.1.1
        with:
          pack-version: 0.40.9

      - name: Build and publish
        uses: atls/buildpacks/buildpacks/publish-image@buildpack-root-1.2.0
        with:
          image: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
          latestImage: ${{ fromJSON(steps.metadata.outputs.json).tags[1] }}
          workspace: ${{ matrix.workspace }}
          builder: ${{ inputs.builder }}
          buildpack: ${{ inputs.buildpack }}
          buildEnv: ${{ secrets.buildEnv }}
        env:
          SKILLS_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
