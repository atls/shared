name: Reusable checks

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version to run this workflow. Default: 24'
        default: '24'
        required: false
        type: string
      node-version-file:
        description: 'Project file declaring Node version; overrides node-version'
        default: ''
        required: false
        type: string
      base-ref:
        description: 'Git comparison revision exposed as RAIJIN_BASE_REF'
        default: ''
        required: false
        type: string
      installPlaywright:
        description: 'Install Playwright browsers before checks'
        default: false
        required: false
        type: boolean
      playwright-version:
        description: 'Playwright version to install. Default: 1.63.0'
        default: '1.63.0'
        required: false
        type: string
      checksCommand:
        description: 'Command to run project checks. Default: yarn check --verify'
        default: 'yarn check --verify'
        required: false
        type: string
      build-images:
        description: Verify container images with Pack on pull requests
        type: boolean
        default: false
      image-include:
        description: Workspace selection from the publishing workflow
        type: string
        default: ''
      image-exclude:
        description: Workspace exclusion from the publishing workflow
        type: string
        default: ''
      image-name-prefix:
        description: Image name prefix from the publishing workflow
        type: string
        default: ''
      image-arm64-workspace:
        description: Workspace that builds on a native ARM64 runner
        type: string
        default: ''

jobs:
  images:
    if: inputs.build-images && github.event_name == 'pull_request'
    uses: ./.github/workflows/pack-image.yaml
    permissions:
      contents: read
      packages: read
    with:
      publish: false
      registryURL: ghcr.io
      registryUser: ${{ github.repository_owner }}
      project: ${{ github.repository_owner }}
      include: ${{ inputs.image-include != '' && inputs.image-include || (inputs.image-exclude == '' && '**' || '') }}
      exclude: ${{ inputs.image-exclude }}
      imageNamePrefix: ${{ inputs.image-name-prefix }}
      arm64Workspace: ${{ inputs.image-arm64-workspace }}

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$REPOSITORY_OWNER" --password-stdin
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Yarn cache directory
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --inline-builds
        env:
          SKILLS_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install playwright
        if: ${{ inputs.installPlaywright }}
        run: yarn dlx playwright@${{ inputs.playwright-version }} install --with-deps

      - name: Checks
        run: ${{ inputs.checksCommand }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAIJIN_BASE_REF: ${{ inputs.base-ref }}
