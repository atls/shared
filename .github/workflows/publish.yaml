name: Reusable publish

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version to run this workflow. Default: 24'
        default: '24'
        required: false
        type: string
      clientId:
        required: true
        type: string
        description: GitHub App client ID for committing changes
      registryServer:
        required: false
        type: string
        default: 'https://registry.npmjs.org'
        description: Where to send the package
      packageAccess:
        description: Access level for published packages
        required: false
        type: string
        default: public
    secrets:
      appPrivateKey:
        required: true
      npmAuthToken:
        required: true

jobs:
  run:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ inputs.clientId }}
          private-key: ${{ secrets.appPrivateKey }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Yarn cache directory
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --inline-builds

      - name: List changed workspaces
        run: yarn workspaces changed list --json

      - name: Defer versions
        run: yarn release version defer
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Version
        run: yarn version apply --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug git diff
        run: |
          git diff

      - name: Capture release workspaces
        run: |
          yarn workspaces changed list --json > "$RUNNER_TEMP/changed-workspaces.jsonl"
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const { join } = require('node:path')
          const candidates = readFileSync(join(process.env.RUNNER_TEMP, 'changed-workspaces.jsonl'), 'utf8')
            .split('\n').filter(Boolean).map(JSON.parse)
            .filter((workspace) => workspace.name && workspace.location !== '.')
          const releases = []
          for (const workspace of candidates) {
            const manifestPath = join(workspace.location, 'package.json')
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'))
            if (manifest.private) continue
            const committed = JSON.parse(execFileSync('git', ['show', `HEAD:${manifestPath}`], { encoding: 'utf8' }))
            if (manifest.version !== committed.version) releases.push(manifest.name)
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-workspaces.txt'), releases.join('\n') + (releases.length ? '\n' : ''))
          NODE

      - name: Compose commit message
        id: commit_message
        run: |
          INITIAL_MESSAGE=$'chore(common): versions\n\n'
          temp_file=$(mktemp)
          yarn workspaces changed foreach -v --exclude . exec "echo \"\$npm_package_name:\$npm_package_version \" >> \"$temp_file\""
          MESSAGE=$(cat "$temp_file")
          cat "$temp_file"
          INITIAL_MESSAGE+=$MESSAGE
          INITIAL_MESSAGE="${INITIAL_MESSAGE//'%'/' '}"
          INITIAL_MESSAGE="${INITIAL_MESSAGE//$'\n'/' '}"
          INITIAL_MESSAGE="${INITIAL_MESSAGE//$'\r'/' '}"
          echo "commitMessage=$INITIAL_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "$INITIAL_MESSAGE"
          rm "$temp_file"

      - name: Commit changes
        id: version-commit
        uses: planetscale/ghcommit-action@v0.2.20
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          repo: ${{ github.repository }}
          branch: master
          commit_message: ${{ steps.commit_message.outputs.commitMessage }}
          file_pattern: '*.json *.md *.yaml *.yml *.lock'

      - name: Checkout versioned release commit
        if: ${{ success() && steps.version-commit.outputs.commit-hash != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version-commit.outputs.commit-hash }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          clean: false

      - name: Install versioned release
        if: ${{ success() && steps.version-commit.outputs.commit-hash != '' }}
        run: yarn install --immutable

      - name: Validate release tags
        if: ${{ success() && steps.version-commit.outputs.commit-hash != '' }}
        run: &release-tags |
          set -euo pipefail
          while IFS= read -r release_workspace; do
            release_tag=$(yarn workspace "$release_workspace" exec node -p "require('./package.json').name + '@' + require('./package.json').version")
            git check-ref-format "refs/tags/$release_tag"
            remote_tag_refs=$(git ls-remote origin "refs/tags/$release_tag" "refs/tags/$release_tag^{}")
            if [ -z "$remote_tag_refs" ] && [ "$CREATE_RELEASES" = 'true' ]; then
              git push origin "$RELEASE_COMMIT:refs/tags/$release_tag"
              remote_tag_refs=$(git ls-remote origin "refs/tags/$release_tag" "refs/tags/$release_tag^{}")
            fi
            if [ -n "$remote_tag_refs" ]; then
              remote_tag_commit=$(awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { print peeled ? peeled : direct }' <<< "$remote_tag_refs")
              test "$remote_tag_commit" = "$RELEASE_COMMIT"
            fi
            if [ "$CREATE_RELEASES" = 'true' ]; then
              yarn workspace "$release_workspace" release create
            fi
          done < "$RUNNER_TEMP/release-workspaces.txt"
        env:
          CREATE_RELEASES: 'false'
          RELEASE_COMMIT: ${{ steps.version-commit.outputs.commit-hash }}

      - name: Npm Publish
        if: ${{ success() && steps.version-commit.outputs.commit-hash != '' }}
        run: |
          set -euo pipefail
          while IFS= read -r release_workspace; do
            yarn workspace "$release_workspace" npm publish --tolerate-republish --access "$PACKAGE_ACCESS"
          done < "$RUNNER_TEMP/release-workspaces.txt"
        env:
          PACKAGE_ACCESS: ${{ inputs.packageAccess }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.npmAuthToken }}
          YARN_NPM_REGISTRY_SERVER: ${{ inputs.registryServer }}
          YARN_NPM_PUBLISH_REGISTRY: ${{ inputs.registryServer }}

      - name: Release
        if: ${{ success() && steps.version-commit.outputs.commit-hash != '' }}
        run: *release-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_RELEASES: 'true'
          RELEASE_COMMIT: ${{ steps.version-commit.outputs.commit-hash }}

      - name: Commit release metadata
        if: ${{ success() && steps.version-commit.outputs.commit-hash != '' }}
        uses: planetscale/ghcommit-action@v0.2.20
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          repo: ${{ github.repository }}
          branch: master
          commit_message: 'chore(common): release metadata'
          file_pattern: '*.json *.md *.yaml *.yml *.lock'
