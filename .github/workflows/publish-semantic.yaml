name: Reusable semantic package publication

on:
  workflow_call:
    inputs:
      packageName:
        description: Public Yarn workspace package name
        required: true
        type: string
      clientId:
        description: GitHub App client ID
        required: true
        type: string
      node-version-file:
        description: Project file declaring Node version
        default: package.json
        required: false
        type: string
      prepareCommand:
        description: Project build command after applying the release version
        default: ''
        required: false
        type: string
      packageAccess:
        description: npm package access
        default: public
        required: false
        type: string
      githubPackages:
        description: Also publish to GitHub Packages
        default: false
        required: false
        type: boolean
      assetPath:
        description: Optional GitHub release asset
        default: ''
        required: false
        type: string
      assetName:
        description: Optional uploaded asset name
        default: ''
        required: false
        type: string
      dryRun:
        description: Calculate the release without publishing
        default: false
        required: false
        type: boolean
    secrets:
      appPrivateKey:
        required: true
      npmAuthToken:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ inputs.clientId }}
          private-key: ${{ secrets.appPrivateKey }}

      - name: Checkout accepted revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Install
        run: yarn install --immutable --inline-builds

      - name: Release package
        uses: atls/shared/.github/actions/release/semantic-release@master
        with:
          packageName: ${{ inputs.packageName }}
          prepareCommand: ${{ inputs.prepareCommand }}
          packageAccess: ${{ inputs.packageAccess }}
          githubPackages: ${{ inputs.githubPackages }}
          assetPath: ${{ inputs.assetPath }}
          assetName: ${{ inputs.assetName }}
          dryRun: ${{ inputs.dryRun }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.npmAuthToken }}
